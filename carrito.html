<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARRITO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./scss-2/styleG.css">
    <link rel="stylesheet" href="./css/carrito.css">
</head>
<body>
        <nav>
            <div class="logo">
                <img src="img/logo-winebox.png" alt="logo-winebox">
                <strong>Winebox</strong>
            </div>
            <div>
                 <a href="categoria.html#tintos" title="enlace vinos"> Regresar a vinos</a>   
            </div>
        </nav>
        <!--todo el main se pasará a javaScript-->
<main>
    <h2 class="titulo-carrito">Mi Carrito</h2>

    <div class="container-carrito">

        <p class="carrito-vacio">Tu carrito está vacío.</p>

        <div class="carrito-productos">

            <article class="carrito-producto">

                <img class="carrito-productos-img" src="./img/vinos/tintos/alamos_malbec.webp"
                     alt="Imagen de vino tinto">

                <div class="carrito-producto-titulo">
                    <small>Título</small>
                    <h2>Vino Tinto Alamos Malbec</h2>
                </div>

                <div class="carrito-producto-cantidad">
                    <small>Cantidad</small>
                    <p>1</p>
                </div>

                <div class="carrito-producto-precio">
                    <small>Precio</small>
                    <p>$1000</p>
                </div>

                <div class="carrito-producto-subtotal">
                    <small>Subtotal</small>
                    <p>$1000</p>
                </div>

                <button class="carrito-producto-eliminar">
                    <i class="bi bi-trash-fill"></i>
                </button>

            </article>

        </div>

    </div>

    <div class="carrito-acciones-izquierda">
        <button>vaciar</button>
    </div>

    <div class="carrito-acciones-derecha">
        <div class="carrito-acciones-total">
            <p>Total</p>
            <P id="total">$1000</P>
        </div>
    </div>
    <button>Comprar todo</button>

</main>

      <footer>
           <P>&copy; 2026 Winebox - Todos los derechos reservados.</P>
      </footer>
</body>
</html>
